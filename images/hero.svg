  <!-- steel rack tube -->
  <rect x="80" y="261" width="840" height="28" rx="14" fill="#0B0C0E"/>
  <rect x="80" y="261" width="840" height="9" rx="4.5" fill="#2E3238"/>
  <!-- towel -->
  <g clip-path="url(#towel)">
    <rect x="290" y="285" width="420" height="163.75" fill="#4E5A44"/><rect x="290" y="447.75" width="420" height="163.75" fill="#6B7A57"/><rect x="290" y="610.5" width="420" height="163.75" fill="#39442F"/><rect x="290" y="773.25" width="420" height="163.75" fill="#8A9972"/>
  </g>
