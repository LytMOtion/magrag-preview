  <defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(0,0,0,0.18)"/><stop offset="0.2" stop-color="rgba(0,0,0,0)"/><stop offset="0.85" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,0.2)"/></linearGradient></defs>
  <!-- magnet at contact point -->
  <circle cx="500" cy="293" r="15" fill="#0B0C0E" stroke="#D7261E" stroke-width="3"/>
  <circle cx="500" cy="293" r="5" fill="#D7261E"/>
  
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="350" y="1206" width="300" height="26" rx="13" fill="rgba(0,0,0,0.55)"/>
    <text x="500" y="1224" font-size="11" letter-spacing="1.5" fill="#FFD166" text-anchor="middle">PLACEHOLDER — HERO: CAMO TOWEL ON BLACK STEEL RACK</text>
